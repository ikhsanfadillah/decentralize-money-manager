<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>Decentralize Money Manager</title>

    <!-- PWA & Mobile WebApp Capabilities -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <script src="/theme-init.js"></script>
    <style>
      :where(html) {
        background-color: #fafafa;
        color-scheme: light;
      }
      :where(html.dark) {
        background-color: #09090b;
        color-scheme: dark;
      }
      :where(body) {
        margin: 0;
        min-height: 100vh;
        background-color: #fafafa;
        background-image: linear-gradient(180deg, #fafafa 0%, #f5f5f7 52%, #f1f1f3 100%);
        background-attachment: fixed;
      }
      :where(html.dark body) {
        background-color: #09090b;
        background-image: linear-gradient(180deg, #09090b 0%, #111114 50%, #16161a 100%);
      }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MoneyManager" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
  </head>
  <body class="antialiased selection:bg-primary selection:text-primary-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
